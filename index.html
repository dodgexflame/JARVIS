<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
:root{--bg:#050b14;--panel:#0b1626;--line:#16324d;--cy:#5fe3ff;--gold:#ffb43a;--tx:#d6eaf7;--dim:#6f8ca3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#0d2036 0,var(--bg) 60%);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font:600 1.1rem "Segoe UI",sans-serif;letter-spacing:.35em;margin:0;color:var(--cy)}
#status{margin-left:auto;color:var(--dim);font-size:.85rem}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--cy)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
#chatcol{display:flex;flex-direction:column;min-height:0}
#core{display:grid;place-items:center;padding:14px 0 4px}
#reactor{width:96px;height:96px;border-radius:50%;border:2px solid var(--cy);box-shadow:0 0 22px #5fe3ff55,inset 0 0 22px #5fe3ff33;position:relative;transition:box-shadow .3s,border-color .3s}
#reactor::before,#reactor::after{content:"";position:absolute;border-radius:50%}
#reactor::before{inset:14px;border:2px dashed var(--cy);opacity:.7}
#reactor::after{inset:36px;background:var(--cy);box-shadow:0 0 18px var(--cy)}
#reactor.busy{border-color:var(--gold);box-shadow:0 0 30px #ffb43a77,inset 0 0 22px #ffb43a44}
#reactor.busy::before{border-color:var(--gold);animation:spin 3s linear infinite}
#reactor.busy::after{background:var(--gold);box-shadow:0 0 18px var(--gold)}
#reactor.off{opacity:.35}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#reactor.busy::before{animation:none}}
#log{flex:1;overflow-y:auto;padding:10px 18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:78ch;padding:10px 14px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:#10304a;border:1px solid var(--line)}
.m.a{align-self:flex-start;background:var(--panel);border-left:3px solid var(--cy)}
.m.s{align-self:center;color:var(--dim);font-size:.9rem;text-align:center}
#bar{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
#inp{flex:1;min-width:0}
#send{background:var(--cy);color:#04121c;border-color:var(--cy);font-weight:600}
aside{border-left:1px solid var(--line);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
aside h2{margin:6px 0 0;font-size:.95rem;color:var(--gold);font-weight:600}
aside label{font-size:.85rem;color:var(--dim)}
textarea{width:100%;resize:vertical;min-height:70px}
#facts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
#facts li{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#facts li span{flex:1;overflow-wrap:anywhere}
#facts button{padding:0 8px;line-height:1.6}
.row{display:flex;gap:8px}.row>*{flex:1}
#panelbtn{display:none}
@media(max-width:800px){
 main{grid-template-columns:1fr}
 aside{display:none;position:fixed;inset:56px 0 0 0;background:var(--bg);z-index:5;border:0}
 aside.open{display:flex}
 #panelbtn{display:inline-block}
}
</style>
</head>
<body>
<header>
 <h1>J.A.R.V.I.S.</h1>
 <span id="status">Offline. Load the model to begin.</span>
 <button id="panelbtn" aria-label="Open settings">Settings</button>
</header>
<main>
 <section id="chatcol">
  <div id="core"><div id="reactor" class="off"></div></div>
  <div id="log" aria-live="polite"></div>
  <div id="bar">
   <button id="mic" title="Speak" aria-label="Speak">Mic</button>
   <input id="inp" placeholder="Ask anything, or say “remember that …”" autocomplete="off" disabled>
   <button id="send" disabled>Send</button>
  </div>
 </section>
 <aside id="side">
  <h2>Brain</h2>
  <label for="model">Model (smaller loads faster)</label>
  <select id="model">
   <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Light: Llama 3.2 1B (~0.7 GB)</option>
   <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Balanced: Qwen 2.5 1.5B (~1 GB)</option>
   <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Smarter: Llama 3.2 3B (~2 GB)</option>
  </select>
  <button id="load">Load model</button>
  <h2>Personality</h2>
  <label for="owner">What should it call you?</label>
  <input id="owner" value="sir">
  <label for="persona">Core instructions</label>
  <textarea id="persona"></textarea>
  <label><input type="checkbox" id="speak"> Speak answers aloud</label>
  <h2>Teach</h2>
  <label for="fact">Add something it should always know</label>
  <textarea id="fact" placeholder="Example: My exam for Business Studies is on 12 February."></textarea>
  <button id="add">Save to memory</button>
  <ul id="facts"></ul>
  <div class="row"><button id="clearchat">Clear chat</button><button id="clearall">Erase all</button></div>
 </aside>
</main>
<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULT_PERSONA="You are J.A.R.V.I.S., a calm, dry-witted personal AI assistant. Be concise and precise, with light, understated humor. Address the user respectfully. If you do not know something, say so plainly instead of guessing. Use the saved memory notes when they are relevant.";

let facts=store.get("facts",[]), history=store.get("history",[]), engine=null, busy=false;
$("persona").value=store.get("persona",DEFAULT_PERSONA);
$("owner").value=store.get("owner","sir");
$("speak").checked=store.get("speak",false);
$("model").value=store.get("model",$("model").value);

function say(text,cls){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;$("log").appendChild(d);$("log").scrollTop=1e9;return d}
function renderFacts(){const ul=$("facts");ul.innerHTML="";facts.forEach((f,i)=>{const li=document.createElement("li");const s=document.createElement("span");s.textContent=f;const b=document.createElement("button");b.textContent="×";b.setAttribute("aria-label","Delete note");b.onclick=()=>{facts.splice(i,1);store.set("facts",facts);renderFacts()};li.append(s,b);ul.appendChild(li)})}
function addFact(t){t=t.trim();if(!t)return;facts.push(t);store.set("facts",facts);renderFacts()}
renderFacts();
history.forEach(m=>say(m.content,m.role==="user"?"u":"a"));
if(!history.length)say("Good day. Load the model from the Brain panel and I will be at your service.","s");

function relevant(q){
 const w=new Set(q.toLowerCase().match(/[a-z0-9]{3,}/g)||[]);
 return facts.map(f=>({f,s:(f.toLowerCase().match(/[a-z0-9]{3,}/g)||[]).filter(x=>w.has(x)).length}))
  .sort((a,b)=>b.s-a.s).slice(0,facts.length<=8?8:6).map(x=>x.f);
}
function systemPrompt(q){
 let p=$("persona").value+"\nAddress the user as \""+($("owner").value||"sir")+"\".\nToday is "+new Date().toLocaleString()+".";
 const r=relevant(q);
 if(r.length)p+="\n\nSaved memory notes (treat as true):\n- "+r.join("\n- ");
 return p;
}

function setBusy(b){busy=b;$("reactor").classList.toggle("busy",b);$("inp").disabled=b||!engine;$("send").disabled=b||!engine}
function speak(t){if(!$("speak").checked||!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}

async function loadModel(){
 if(!navigator.gpu){$("status").textContent="This browser has no WebGPU.";say("WebGPU is not available here. Use the latest Chrome or Edge on a PC or laptop.","s");return}
 $("load").disabled=true;$("reactor").classList.remove("off");$("reactor").classList.add("busy");
 store.set("model",$("model").value);
 try{
  engine=await webllm.CreateMLCEngine($("model").value,{initProgressCallback:p=>{$("status").textContent=p.text.slice(0,70)}});
  $("status").textContent="Online. Running on your device.";
  $("reactor").classList.remove("busy");setBusy(false);$("inp").focus();
  say("Systems online. How may I help, "+($("owner").value||"sir")+"?","s");
 }catch(e){
  $("status").textContent="Load failed.";$("reactor").classList.remove("busy");$("reactor").classList.add("off");$("load").disabled=false;
  say("The model failed to load: "+(e.message||e)+". Check your connection and try the Light model.","s");
 }
}

async function ask(text){
 text=text.trim();if(!text||busy||!engine)return;
 $("inp").value="";say(text,"u");
 const m=text.match(/^(?:jarvis[, ]+)?remember(?: that)?[:,]?\s+(.+)/i);
 if(m){addFact(m[1]);const r="Noted and stored, "+($("owner").value||"sir")+".";say(r,"a");speak(r);history.push({role:"user",content:text},{role:"assistant",content:r});store.set("history",history.slice(-40));return}
 setBusy(true);
 const out=say("…","a");
 const msgs=[{role:"system",content:systemPrompt(text)},...history.slice(-12),{role:"user",content:text}];
 let full="";
 try{
  const stream=await engine.chat.completions.create({messages:msgs,stream:true,temperature:.7,max_tokens:600});
  for await(const c of stream){full+=c.choices[0]?.delta?.content||"";out.textContent=full||"…";$("log").scrollTop=1e9}
  history.push({role:"user",content:text},{role:"assistant",content:full});
  store.set("history",history.slice(-40));speak(full);
 }catch(e){out.textContent="Something went wrong: "+(e.message||e)}
 setBusy(false);$("inp").focus();
}

$("load").onclick=loadModel;
$("send").onclick=()=>ask($("inp").value);
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")ask($("inp").value)});
$("add").onclick=()=>{addFact($("fact").value);$("fact").value=""};
$("persona").onchange=()=>store.set("persona",$("persona").value);
$("owner").onchange=()=>store.set("owner",$("owner").value);
$("speak").onchange=()=>{store.set("speak",$("speak").checked);if(!$("speak").checked&&window.speechSynthesis)speechSynthesis.cancel()};
$("clearchat").onclick=()=>{history=[];store.set("history",[]);$("log").innerHTML="";say("Chat cleared.","s")};
$("clearall").onclick=()=>{if(!confirm("Erase all notes, chat and settings on this device?"))return;try{localStorage.clear()}catch(e){}location.reload()};
$("panelbtn").onclick=()=>{const o=$("side").classList.toggle("open");$("panelbtn").textContent=o?"Close":"Settings"};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$("mic").style.display="none";
else $("mic").onclick=()=>{const r=new SR();r.lang="en-IN";r.onresult=e=>ask(e.results[0][0].transcript);r.onerror=()=>say("The microphone did not work. Allow mic access and try again.","s");r.start();$("mic").textContent="Listening"; r.onend=()=>{$("mic").textContent="Mic"}};
</script>
</body>
</html>
